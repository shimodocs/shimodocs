<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="320" viewBox="0 0 1440 320" role="img" aria-labelledby="title desc">
  <title id="title">ShimoDocs Private Deployment</title>
  <desc id="desc">Download the release package, deploy it in your private environment, request a free license by email, then activate ShimoDocs and start collaborating.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#eef5ff"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#165dff"/>
      <stop offset="1" stop-color="#4d8dff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1d4ed8" flood-opacity=".09"/>
    </filter>
  </defs>

  <rect width="1440" height="320" rx="28" fill="url(#bg)"/>
  <circle cx="1355" cy="45" r="110" fill="#dbeafe" opacity=".55"/>
  <circle cx="75" cy="300" r="130" fill="#e0f2fe" opacity=".55"/>

  <g stroke="#93b4f8" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 10" opacity=".9">
    <path d="M330 160H405"/>
    <path d="M675 160H750"/>
    <path d="M1020 160H1095"/>
  </g>
  <g fill="#93b4f8">
    <path d="M397 153l13 7-13 7z"/>
    <path d="M742 153l13 7-13 7z"/>
    <path d="M1087 153l13 7-13 7z"/>
  </g>

  <g filter="url(#shadow)">
    <g transform="translate(60 60)">
      <rect width="270" height="200" rx="22" fill="#fff" stroke="#dbe7ff"/>
      <circle cx="48" cy="48" r="25" fill="url(#accent)"/>
      <path d="M38 48h20M48 38v20" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
      <text x="86" y="45" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif" font-size="16" font-weight="700" fill="#165dff">STEP 01</text>
      <text x="28" y="105" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="24" font-weight="700" fill="#172033">Download Package</text>
      <text x="28" y="139" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="16" fill="#667085">Get the latest package</text>
      <text x="28" y="164" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="16" fill="#667085">from GitHub Releases</text>
    </g>

    <g transform="translate(405 60)">
      <rect width="270" height="200" rx="22" fill="#fff" stroke="#dbe7ff"/>
      <circle cx="48" cy="48" r="25" fill="url(#accent)"/>
      <path d="M36 52l12-14 12 14M40 50v10h16V50" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="86" y="45" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif" font-size="16" font-weight="700" fill="#165dff">STEP 02</text>
      <text x="28" y="105" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="24" font-weight="700" fill="#172033">Deploy Privately</text>
      <text x="28" y="139" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="16" fill="#667085">Use your own servers,</text>
      <text x="28" y="164" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="16" fill="#667085">private cloud, or data center</text>
    </g>

    <g transform="translate(750 60)">
      <rect width="270" height="200" rx="22" fill="#fff" stroke="#dbe7ff"/>
      <circle cx="48" cy="48" r="25" fill="url(#accent)"/>
      <path d="M35 40h26v18H35zM35 41l13 10 13-10" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="86" y="45" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif" font-size="16" font-weight="700" fill="#165dff">STEP 03</text>
      <text x="28" y="105" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="22" font-weight="700" fill="#172033">Request Free License</text>
      <text x="28" y="139" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="16" fill="#667085">Send an email to</text>
      <text x="28" y="164" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="16" font-weight="600" fill="#165dff">support.global@shimo.im</text>
    </g>

    <g transform="translate(1095 60)">
      <rect width="285" height="200" rx="22" fill="#fff" stroke="#dbe7ff"/>
      <circle cx="48" cy="48" r="25" fill="url(#accent)"/>
      <path d="M37 49l8 8 15-18" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="86" y="45" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif" font-size="16" font-weight="700" fill="#165dff">STEP 04</text>
      <text x="28" y="105" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="21" font-weight="700" fill="#172033">Activate &amp; Collaborate</text>
      <text x="28" y="139" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="16" fill="#667085">Free for up to 5 users</text>
      <text x="28" y="164" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="16" fill="#667085">No credit card required</text>
    </g>
  </g>
</svg>
